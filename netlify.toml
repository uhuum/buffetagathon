# =============================================================
# Netlify — Configuração do Buffet Agathon
# =============================================================

[build]
  command   = "pnpm build"
  publish   = ".next"

[build.environment]
  # O Service Worker precisa conter a configuracao publica do Firebase para
  # receber FCM em background. Mantemos o secrets scan ativo no restante.
  SECRETS_SCAN_OMIT_PATHS = "public/firebase-messaging-sw.js,public/sw.js"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

[functions."cron-agenda-fim-de-semana"]
  schedule = "0 12 * * 1"

[functions."cron-tres-dias-antes"]
  schedule = "0 12 * * *"

[functions."cron-um-dia-antes"]
  schedule = "0 21 * * *"

[functions."cron-no-dia"]
  schedule = "0 11 * * *"

[functions."cron-uma-hora-antes"]
  schedule = "0 * * * *"

# Todos os dias às 08:00 BRT: lembrete de atendimentos presenciais
[functions."cron-atendimentos-hoje"]
  schedule = "0 11 * * *"
